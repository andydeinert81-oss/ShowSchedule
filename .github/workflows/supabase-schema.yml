# Applies supabase/schema.sql to the ShowSchedule database whenever it changes (or on demand).
# The script is written to be safe to re-run: it only adds what's missing and never deletes data.
# Uses the same SUPABASE_ACCESS_TOKEN repository secret as the function deploy; does nothing without it.
name: Apply database schema

on:
  push:
    branches: [main]
    paths: ['supabase/schema.sql', '.github/workflows/supabase-schema.yml']
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rrytuhdatmnauakqrjla
    steps:
      - name: Skip if no access token is set
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "::notice::Add the SUPABASE_ACCESS_TOKEN repository secret to apply the schema automatically."
      - uses: actions/checkout@v4
        if: env.SUPABASE_ACCESS_TOKEN != ''
      - name: Run schema.sql on the project database
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          jq -Rs '{query: .}' supabase/schema.sql > /tmp/body.json
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data @/tmp/body.json)
          echo "HTTP $code"; head -c 2000 /tmp/out.json; echo
          test "$code" -ge 200 -a "$code" -lt 300
